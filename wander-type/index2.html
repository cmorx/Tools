<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wander Type</title>
<style>
  :root{
    --paper:#ffffff;
    --ink:#111111;
    --rule:#e4e4e4;
    --mute:#9a9a9a;
    --pad:26px;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--mono);
    display:grid;
    grid-template-columns:288px 1fr;
    overflow:hidden;
  }

  /* ---------- left rail ---------- */
  .rail{
    border-right:1px solid var(--rule);
    padding:var(--pad) var(--pad) 18px;
    display:flex;
    flex-direction:column;
    gap:26px;
    overflow-y:auto;
  }
  .masthead h1{
    font-size:12px;
    font-weight:700;
    letter-spacing:.34em;
    text-transform:uppercase;
  }

  .group{display:flex;flex-direction:column;gap:14px}
  .group > .gname{
    font-size:9px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--mute);
    padding-bottom:9px;
    border-bottom:1px solid var(--rule);
  }

  textarea{
    width:100%;
    resize:vertical;
    min-height:56px;
    border:none;
    border-bottom:1px solid var(--ink);
    background:none;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.7;
    letter-spacing:.12em;
    color:var(--ink);
    outline:none;
    padding:0 0 8px;
  }
  textarea::placeholder{color:#d0d0d0}

  .seg{display:flex;border:1px solid var(--rule)}
  .seg button{
    flex:1;border:none;border-right:1px solid var(--rule);
    padding:7px 0;font-size:10px;letter-spacing:.12em;text-transform:none;
  }
  .seg button:last-child{border-right:none}
  .seg button:hover{background:#f3f3f3;color:var(--ink)}
  .seg button.on,.seg button.on:hover{background:var(--ink);color:var(--paper)}

  .row{display:flex;flex-direction:column;gap:5px}
  .rowhead{display:flex;justify-content:space-between;align-items:baseline}
  .lab{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
  .val{font-size:10px;color:var(--ink);font-variant-numeric:tabular-nums}

  /* slider: the track is itself a random walk */
  .slider{position:relative;height:22px}
  .slider svg{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    width:100%;height:18px;overflow:visible;pointer-events:none;
  }
  .slider svg path{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
  .slider input{
    position:relative;
    width:100%;height:22px;margin:0;
    -webkit-appearance:none;appearance:none;
    background:transparent;outline:none;cursor:ew-resize;
    touch-action:none;                       /* drag stays with the slider, not the page */
    -webkit-tap-highlight-color:transparent;
  }
  .slider input::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:12px;height:12px;background:var(--ink);border:none;border-radius:0;
  }
  .slider input::-moz-range-thumb{
    width:12px;height:12px;background:var(--ink);border:none;border-radius:0;
  }

  /* touch screens: fingers need a much bigger grab area than a mouse */
  @media (pointer:coarse){
    .slider{height:40px}
    .slider input{height:40px}
    .slider input::-webkit-slider-thumb{
      width:26px;height:26px;border-radius:50%;
      border:5px solid var(--paper);           /* white ring keeps the dot visually small */
      background:var(--ink);box-sizing:border-box;
    }
    .slider input::-moz-range-thumb{
      width:26px;height:26px;border-radius:50%;
      border:5px solid var(--paper);
      background:var(--ink);box-sizing:border-box;
    }
    .row{gap:2px}
    .group{gap:8px}
    .lab,.val{font-size:11px}
  }
  .slider input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink);outline-offset:3px}

  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:24px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{
    background:none;border:1px solid var(--ink);color:var(--ink);
    padding:9px 10px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.22em;text-transform:uppercase;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  button:hover{background:var(--ink);color:var(--paper)}

  /* ---------- right stage ---------- */
  .stage{position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .hint{
    position:absolute;left:22px;bottom:18px;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#c8c8c8;
    pointer-events:none;user-select:none;
  }
  .count{
    position:absolute;right:22px;bottom:18px;
    font-size:9px;letter-spacing:.2em;color:#c8c8c8;
    font-variant-numeric:tabular-nums;pointer-events:none;user-select:none;
  }

  @media (max-width:760px){
    body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;overflow:auto}
    .rail{order:2;border-right:none;border-top:1px solid var(--rule);max-height:52vh}
    .stage{order:1;min-height:48vh}
    .actions{margin-top:8px}
  }
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>

<aside class="rail">
  <div class="masthead">
    <h1>Wander Type</h1>
  </div>

  <div class="group">
    <div class="gname">Text</div>
    <textarea id="textInput" rows="2" spellcheck="false" placeholder="type here">How is your day</textarea>
    <div class="seg" id="caseSeg">
      <button data-case="mixed" class="on">Aa</button>
      <button data-case="upper">AA</button>
      <button data-case="lower">aa</button>
    </div>
  </div>

  <div class="group">
    <div class="gname">Glyph</div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">width</span><span class="val" id="gwv">60</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="gwidth" min="20" max="150" value="60"></div>
    </div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">height</span><span class="val" id="ghv">120</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="gheight" min="40" max="280" value="120"></div>
    </div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">tracking</span><span class="val" id="trv">16</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="tracking" min="-10" max="90" value="16"></div>
    </div>
  </div>

  <div class="group">
    <div class="gname">Walk</div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">wander</span><span class="val" id="wv">8</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="wander" min="1" max="40" value="8"></div>
    </div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">inertia</span><span class="val" id="iv">0.85</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="inertia" min="30" max="98" value="85"></div>
    </div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">speed</span><span class="val" id="spv">1.0</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="speed" min="10" max="300" value="100"></div>
    </div>
  </div>

  <div class="group">
    <div class="gname">Render</div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">weight</span><span class="val" id="sw">1.5</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="weight" min="1" max="20" value="3"></div>
    </div>
    <div class="row" data-slider>
      <div class="rowhead"><span class="lab">zoom</span><span class="val" id="zv">90%</span></div>
      <div class="slider"><svg preserveAspectRatio="none" viewBox="0 0 200 18"><path/></svg><input type="range" id="zoom" min="20" max="150" value="90"></div>
    </div>
  </div>

  <div class="actions">
    <button id="btnRegen">Regenerate</button>
    <div class="pair">
      <button id="btnSvg">SVG</button>
      <button id="btnPng">PNG</button>
    </div>
  </div>
</aside>

<main class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hint">click canvas or press R to walk again</div>
  <div class="count" id="count"></div>
</main>

  '%': [ [[0.86,0.04],[0.14,0.96]], [[0.16,0.04],[0.04,0.16],[0.16,0.3],[0.3,0.18],[0.16,0.04]], [[0.72,0.7],[0.6,0.82],[0.72,0.96],[0.86,0.84],[0.72,0.7]] ],
};

// advance width relative to the width slider — punctuation stays narrow
const WIDTH = {
  '.':0.3, ',':0.3, ':':0.3, ';':0.3, '!':0.3, "'":0.25, '"':0.45,
  '?':0.75, '-':0.5, '_':0.7, '(':0.42, ')':0.42, '[':0.42, ']':0.42,
  '/':0.6, '\\':0.6, '+':0.65, '=':0.65, '*':0.5, '#':0.85, '1':0.7,
  a:0.8, b:0.82, c:0.78, d:0.82, e:0.8, f:0.55, g:0.82, h:0.82, i:0.28,
  j:0.36, k:0.78, l:0.3, m:1.2, n:0.82, o:0.82, p:0.82, q:0.82, r:0.58,
  s:0.74, t:0.55, u:0.82, v:0.76, w:1.15, x:0.76, y:0.76, z:0.74,
};

let allPaths = [];                       // flat list of polylines, layout coords
let bounds = {minX:0,minY:0,maxX:1,maxY:1};

function rnd(a, b) { return Math.random()*(b-a)+a; }
const $ = id => document.getElementById(id);

/* ---------- the walk (unchanged) ---------- */
function walkStroke(waypoints, ox, oy, gw, gh, wander, inertia, speed) {
  const wpts = waypoints.map(p => [ox + p[0]*gw, oy + p[1]*gh]);
  const path = [];
  let px = wpts[0][0] + rnd(-wander*0.3, wander*0.3);
  let py = wpts[0][1] + rnd(-wander*0.3, wander*0.3);
  let vx = rnd(-1,1), vy = rnd(-1,1);
  path.push([px, py]);

  for (let wi = 0; wi < wpts.length - 1; wi++) {
    const tx = wpts[wi+1][0];
    const ty = wpts[wi+1][1];
    const segDist = Math.hypot(tx-wpts[wi][0], ty-wpts[wi][1]);
    const steps = Math.min(900, Math.max(30, Math.floor(segDist / speed * 80)));

    for (let s = 0; s < steps; s++) {
      const dx = tx - px, dy = ty - py;
      const dist = Math.hypot(dx, dy) + 0.001;

      const pull = Math.min(dist * 0.2, 4.0) * speed;

      const wanderAngle = rnd(0, Math.PI * 2);
      const wanderForce = wander * rnd(0.3, 1.0);
      const wx = Math.cos(wanderAngle) * wanderForce;
      const wy = Math.sin(wanderAngle) * wanderForce;

      const ax = (dx/dist) * pull + wx;
      const ay = (dy/dist) * pull + wy;

      vx = vx * inertia + ax * (1 - inertia);
      vy = vy * inertia + ay * (1 - inertia);

      px += vx * speed;
      py += vy * speed;
      path.push([px, py]);

      if (dist < wander * 0.4 + 1.5) break;
    }
  }
  return path;
}

let caseMode = 'mixed';

function params() {
  return {
    gw: parseFloat($('gwidth').value),
    gh: parseFloat($('gheight').value),
    tr: parseFloat($('tracking').value),
    wander: parseFloat($('wander').value),
    inertia: parseFloat($('inertia').value) / 100,
    speed: parseFloat($('speed').value) / 100,
    sw: parseFloat($('weight').value) / 2,
    zoom: parseFloat($('zoom').value) / 100,
    text: caseMode === 'upper' ? $('textInput').value.toUpperCase()
        : caseMode === 'lower' ? $('textInput').value.toLowerCase()
        : $('textInput').value
  };
}

/* ---------- layout: walk every glyph in a coordinate space of its own ---------- */
function generate() {
  const p = params();
  allPaths = [];

  const lines = p.text.split('\n');
  const leading = p.gh * 1.4;
  let y = 0;

  lines.forEach(line => {
    let x = 0;
    line.split('').forEach(c => {
      if (c === ' ') { x += p.gw * 0.5 + p.tr; return; }
      const skel = SK[c];
      if (!skel) { x += p.gw + p.tr; return; }
      const gw = p.gw * (WIDTH[c] || 1);
      skel.forEach(stroke => {
        allPaths.push(walkStroke(stroke, x, y, gw, p.gh, p.wander, p.inertia, p.speed));
      });
      x += gw + p.tr;
    });
    y += leading;
  });

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  allPaths.forEach(path => path.forEach(pt => {
    if (pt[0] < minX) minX = pt[0];
    if (pt[0] > maxX) maxX = pt[0];
    if (pt[1] < minY) minY = pt[1];
    if (pt[1] > maxY) maxY = pt[1];
  }));
  bounds = allPaths.length ? {minX, minY, maxX, maxY} : {minX:0, minY:0, maxX:1, maxY:1};

  const pts = allPaths.reduce((n, path) => n + path.length, 0);
  $('count').textContent = allPaths.length ? allPaths.length + ' strokes / ' + pts + ' steps' : '';

  draw();
}

/* ---------- draw whatever was walked, fitted to the stage ---------- */
function draw() {
  const p = params();
  const dpr = window.devicePixelRatio || 1;
  const W = stage.clientWidth, H = stage.clientHeight;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  if (!allPaths.length) return;

  const bw = Math.max(bounds.maxX - bounds.minX, 1);
  const bh = Math.max(bounds.maxY - bounds.minY, 1);
  const margin = 60;
  const fit = Math.min((W - margin*2) / bw, (H - margin*2) / bh) * p.zoom;

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(fit, fit);
  ctx.translate(-(bounds.minX + bw/2), -(bounds.minY + bh/2));

  ctx.strokeStyle = '#111';
  ctx.lineWidth = p.sw;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  allPaths.forEach(path => {
    ctx.beginPath();
    ctx.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
    ctx.stroke();
  });
  ctx.restore();
}

/* ---------- export ---------- */
function svgMarkup() {
  const sw = parseFloat($('weight').value) / 2;
  const pad = sw * 3 + 20;
  const w = (bounds.maxX - bounds.minX) + pad*2;
  const h = (bounds.maxY - bounds.minY) + pad*2;
  let paths = '';
  allPaths.forEach(path => {
    const d = path.map((pt,i) => (i===0?'M':'L') + pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(' ');
    paths += `<path d="${d}" stroke="#111111" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>\n`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w.toFixed(0)}" height="${h.toFixed(0)}" viewBox="${(bounds.minX-pad).toFixed(1)} ${(bounds.minY-pad).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}">\n<rect x="${(bounds.minX-pad).toFixed(1)}" y="${(bounds.minY-pad).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#ffffff"/>\n${paths}</svg>`;
}

function saveSVG() {
  if (!allPaths.length) return;
  const a = document.createElement('a');
  a.download = 'wander_type.svg';
  a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarkup());
  a.click();
}

function savePNG() {
  if (!allPaths.length) return;
  const sw = parseFloat($('weight').value) / 2;
  const pad = sw * 3 + 20;
  const bw = (bounds.maxX - bounds.minX) + pad*2;
  const bh = (bounds.maxY - bounds.minY) + pad*2;
  const scale = Math.min(2400 / bw, 4);

  const off = document.createElement('canvas');
  off.width = Math.round(bw * scale);
  off.height = Math.round(bh * scale);
  const o = off.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, off.width, off.height);
  o.scale(scale, scale);
  o.translate(-(bounds.minX - pad), -(bounds.minY - pad));
  o.strokeStyle = '#111';
  o.lineWidth = sw;
  o.lineJoin = 'round';
  o.lineCap = 'round';
  allPaths.forEach(path => {
    o.beginPath();
    o.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) o.lineTo(path[i][0], path[i][1]);
    o.stroke();
  });

  const a = document.createElement('a');
  a.download = 'wander_type.png';
  a.href = off.toDataURL('image/png');
  a.click();
}

/* ---------- slider tracks, walked with the same algorithm ---------- */
function drawTracks() {
  document.querySelectorAll('.slider svg path').forEach(path => {
    let y = 9, vy = 0, d = 'M 0,9';
    for (let x = 4; x <= 200; x += 4) {
      vy = vy * 0.72 + rnd(-1, 1) * 0.9;
      y = Math.max(4, Math.min(14, y + vy));
      d += ' L ' + x + ',' + y.toFixed(2);
    }
    path.setAttribute('d', d);
  });
}

/* ---------- wiring ---------- */
const LABELS = { gwidth:'gwv', gheight:'ghv', tracking:'trv', wander:'wv', inertia:'iv', speed:'spv', weight:'sw', zoom:'zv' };
const REGEN = ['gwidth','gheight','tracking','wander','inertia','speed'];  // change the walk
const REDRAW = ['weight','zoom'];                                          // change the picture only

function readout(id, v) {
  return id === 'inertia' ? (v/100).toFixed(2)
       : id === 'speed'   ? (v/100).toFixed(1)
       : id === 'weight'  ? (v/2).toFixed(1)
       : id === 'zoom'    ? v + '%'
       : v;
}

let queued = null;
function schedule(fn) {
  if (queued) cancelAnimationFrame(queued);
  queued = requestAnimationFrame(() => { queued = null; fn(); });
}

Object.keys(LABELS).forEach(id => {
  const el = $(id);
  el.addEventListener('input', function () {
    $(LABELS[id]).textContent = readout(id, this.value);
    schedule(REGEN.includes(id) ? generate : draw);
  });
});

$('textInput').addEventListener('input', () => schedule(generate));
document.querySelectorAll('#caseSeg button').forEach(b => {
  b.addEventListener('click', () => {
    caseMode = b.dataset.case;
    document.querySelectorAll('#caseSeg button').forEach(x => x.classList.toggle('on', x === b));
    generate();
  });
});
$('btnRegen').addEventListener('click', generate);
$('btnSvg').addEventListener('click', saveSVG);
$('btnPng').addEventListener('click', savePNG);
stage.addEventListener('click', generate);
window.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && document.activeElement.tagName !== 'TEXTAREA') generate();
});
new ResizeObserver(() => schedule(draw)).observe(stage);

drawTracks();
generate();
</script>
</body>
</html>
